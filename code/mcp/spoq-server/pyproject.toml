[project]
name = "spoq"
version = "1.0.0"
description = "SPOQ: Multi-agent AI orchestration with wave-based parallel execution and quality gates"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Royce Carbowitz" },
    { name = "Dheeraj Kumar" },
]
maintainers = [
    { name = "Pinpoint Technologies LLC", email = "royce@testwithpinpoint.com" },
]
keywords = ["ai", "agents", "orchestration", "mcp", "claude", "spoq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.26,<2",
    "packaging>=24.0",
    "pyyaml>=6.0",
    "httpx>=0.27,<1",
    "tomlkit>=0.13,<1",
]

[project.scripts]
spoq = "spoq_server.cli:main"
spoq-mcp = "spoq_server.cli:mcp_main"

[project.optional-dependencies]
search = ["sqlite-vec==0.1.9", "fastembed>=0.9,<1"]
codex = ["websockets>=14,<17"]

[project.urls]
Homepage = "https://spoqpaper.com"
Repository = "https://github.com/Durban-Designer/spoq"
Documentation = "https://spoqpaper.com/quickstart"
Organization = "https://testwithpinpoint.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spoq_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "anyio>=4.12.1",
    "pytest>=8.0",
    "pytest-anyio>=0.0.0",
    "twine>=7.0.0",
]
