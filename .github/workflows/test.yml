name: Source verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: npm --prefix code/apps/spoq-ui ci
      - run: npm --prefix code/apps/spoq-ui audit --audit-level=high
      - run: npm --prefix code/apps/spoq-ui test -- --runInBand
      - run: npm --prefix code/apps/spoq-ui run format:check
      - run: npm --prefix code/apps/spoq-ui run build
      - run: python code/scripts/build-spoq-ui.py
      - run: python code/scripts/build-spoq-ui.py --check
      - run: git diff --exit-code -- code/mcp/spoq-server/src/spoq_server/data/ui
      - run: npx playwright install --with-deps chromium
        working-directory: code/apps/spoq-ui
      - run: npm --prefix code/apps/spoq-ui run test:e2e
      - run: uv build --project code/mcp/spoq-server
      - run: python tests/e2e/spoq_v11_viewer.py --artifact code/mcp/spoq-server/dist/spoq-*-py3-none-any.whl --out tests/e2e/results/ci-viewer
  python:
    needs: viewer
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python -m pip install uv
      - run: uv sync --project code/mcp/spoq-server --locked --extra search --extra codex --python '${{ matrix.python }}'
      - run: uv export --project code/mcp/spoq-server --locked --all-extras --no-dev --no-hashes --no-emit-project --output-file /tmp/spoq-runtime-requirements.txt
      - run: uvx pip-audit --strict --no-deps --disable-pip -r /tmp/spoq-runtime-requirements.txt
      - run: uv build --project code/mcp/spoq-server
      - run: uv run --project code/mcp/spoq-server python -m compileall -q code/mcp/spoq-server/src
      - run: uv run --project code/mcp/spoq-server --extra search --extra codex python -m pytest code/mcp/spoq-server/tests tests -q
      - run: python tests/e2e/spoq_release.py --python '${{ matrix.python }}' --artifact code/mcp/spoq-server/dist/spoq-*-py3-none-any.whl --extras search,codex --out tests/e2e/results/ci-installed
      - if: matrix.python == '3.12'
        run: python tests/e2e/spoq_v11_workflows.py --artifact code/mcp/spoq-server/dist/spoq-*-py3-none-any.whl --out tests/e2e/results/ci-workflows
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-science texlive-pictures texlive-fonts-recommended
      - run: make -C documents/latex/projects/spoq-paper pdf
